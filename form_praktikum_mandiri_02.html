<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kotopedia - Form</title>
<style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .nav-bar { border: 2px solid #000; padding: 10px; margin-bottom: 20px; display: flex; justify-content: space-around; font-size: 14px; }
    .container { display: flex; gap: 20px; flex-wrap: wrap; }
    .left-col { width: 200px; text-align: center; }
    .right-col { flex: 1; min-width: 300px; }
    .form-group { display: flex; margin-bottom: 15px; align-items: flex-start; }
    .form-group label { width: 150px; font-size: 14px; }
    .form-group input[type="text"], .form-group textarea, .form-group select, .form-group input[type="number"] { flex: 1; padding: 5px; border: 2px solid #000; }
    .checkbox-group { margin-left: 150px; font-size: 14px; margin-bottom: 15px; }
    .btn-submit { background-color: #4CAF50; color: white; padding: 10px 20px; border: 2px solid #000; cursor: pointer; margin-left: 150px; font-weight: bold; }
</style>
</head>
<body>

    <div class="nav-bar">
        <span>Home</span> | <span>Generate Link</span> | <span>Transaction History</span> | <span>Policy</span> | <span>Logout</span>
    </div>
    <form action="hasil.html" method="GET">
        <div class="container">
            <div class="left-col">
                <!-- Tampilan gambar statis -->
                <img src="scoopybekas.jpg" alt="Scoopy Bekas" style="width: 200px; height: 200px; border: 2px solid #000; object-fit: cover; margin-bottom: 10px;">
                <!-- Nama gambar dikirim sembunyi-sembunyi -->
                <input type="hidden" name="gambar" value="scoopybekas.jpg">
            </div>
            
            <div class="right-col">
                <div class="form-group">
                    <label>Title Here</label>
                    <input type="text" name="title" value="Scoopy Bekas + Cogan Rp 1.000.000.000.000" readonly>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea name="description" rows="4" readonly>Year : 2006&#10;Model : Lama&#10;Condition : Mulus no minus</textarea>
                </div>
                <div class="form-group">
                    <label>Account Number</label>
                    <input type="text" name="account_number" value="123-456-789-0">
                </div>
                <div class="form-group">
                    <label>Bank</label>
                    <select name="bank">
                        <option value="BCA">BCA</option>
                        <option value="BSI">BSI</option>
                        <option value="BTN">BTN</option>
                    </select>
                </div>
                
                <!-- Tambahkan atribut name pada Account Holder -->
                <div class="form-group">
                    <label>Account Holder</label>
                    <input type="text" name="account_holder" placeholder="Name Here">
                </div>
                
                <div class="form-group" style="align-items: center;">
                    <label>Transaction :</label>
                    <input type="number" name="transaction_count" value="1" min="1" style="width: 50px; flex: none;">
                </div>
                
                <div class="form-group">
                    <label>Send to Mobile Phone</label>
                    <input type="text" name="mobile" value="08124868">
                </div>
                <div class="form-group">
                    <label>Send to Email</label>
                    <input type="text" name="email" value="fatih@gantengbanget.com">
                </div>
                <button type="submit" class="btn-submit">Generate Web Link</button>
            </div>
        </div>
    </form>

</body>
</html>
